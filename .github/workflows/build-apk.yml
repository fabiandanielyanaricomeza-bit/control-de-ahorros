name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Syntax (EL DETECTIVE)
        run: |
          echo "Buscando errores de sintaxis en el código Python..."
          python -m compileall -q .
        # Si hay un error tipográfico o de código en tu app, 
        # GitHub Actions se detendrá aquí y te mostrará la línea exacta.

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Linux Toolchain for Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Clean build environment
        run: rm -rf .venv venv env .env .git .github

      - name: Build APK with Flet
        run: flet build apk --python-version 3.12 -v
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
