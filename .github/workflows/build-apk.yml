name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Linux Toolchain for Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Isolate App (Fix compileall errors)
        run: |
          mkdir app_build
          cp main.py app_build/
          # Si tienes una carpeta de imágenes/assets descomenta la siguiente línea:
          # cp -r assets app_build/ || true

      - name: Build APK with Flet
        run: |
          cd app_build
          flet build apk --python-version 3.12 -v
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_build/build/apk/*.apk
